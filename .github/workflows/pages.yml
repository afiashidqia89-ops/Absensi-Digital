name: Deploy ke GitHub Pages

# Mempublikasikan game (folder www/) ke GitHub Pages,
# sehingga bisa dimainkan langsung dari browser tanpa APK.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Unggah artefak situs
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy ke Pages
        id: deployment
        uses: actions/deploy-pages@v4
