name: Build Android APK

# Build APK otomatis setiap kali ada push ke main/master,
# atau manual dari tab Actions. Push tag v* akan membuat GitHub Release berisi APK.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pasang dependensi
        run: npm install

      - name: Tambah platform Android (Capacitor)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Kunci orientasi landscape (MainActivity)
        run: python3 tools/patch-manifest.py android/app/src/main/AndroidManifest.xml

      - name: Sinkronkan aset web
        run: npx cap sync android

      - name: Build APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperBimo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Buat GitHub Release (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            🎮 **Super Bimo** — build APK Android

            Cara instal:
            1. Unduh `app-debug.apk` di bawah ini.
            2. Buka file di ponsel Android, izinkan "instal dari sumber tidak dikenal".
            3. Mainkan! (Mode landscape disarankan)
