name: Absen APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # >>> Nama aplikasi yang tampil di HP <<<
  APP_NAME: MyAbsen
  # >>> GANTI: URL Vercel Anda (yang Anda buka di Chrome) <<<
  VERCEL_URL: https://absensi-digital-rouge.vercel.app

jobs:
  apk:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Siapkan Android SDK (lisensi + paket wajib)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null || true

      - name: Install dependensi
        run: npm install --legacy-peer-deps

      - name: Install Capacitor 7 versi tetap (kompatibel Java 21)
        run: npm install @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7 --legacy-peer-deps

      - name: Build web (opsional - tidak menghalangi build APK)
        run: npm run build
        continue-on-error: true

      - name: Buat project Android baru dari nol
        run: |
          rm -rf android
          if ! npx cap add android; then
            rm -f capacitor.config.ts capacitor.config.json
            mkdir -p www
            printf '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyAbsen</title></head><body><h1>MyAbsen</h1></body></html>' > www/index.html
            npx cap init "MyAbsen" "com.absensi.digital" --web-dir www
            npx cap add android
          fi
          npx cap sync android

      - name: Ganti nama aplikasi
        run: |
          S=android/app/src/main/res/values/strings.xml
          sed -i "s#<string name=\"app_name\">.*</string>#<string name=\"app_name\">$APP_NAME</string>#" $S
          sed -i "s#<string name=\"title_activity_main\">.*</string>#<string name=\"title_activity_main\">$APP_NAME</string>#" $S
          echo "Nama aplikasi: $APP_NAME"

      - name: Terapkan logo kustom (ikon & splash)
        run: |
          mkdir -p assets
          LOGO=""
          for p in assets/logo.png assets/icon.png icon.png logo.png public/logo.png public/icon.png public/icon-512.png public/icons/icon-512.png; do
            [ -f "$p" ] && LOGO="$p" && break
          done
          if [ -z "$LOGO" ]; then
            for p in assets/*.png assets/*.jpg icon/*.* icons/*.*; do
              case "$p" in *splash*) continue;; esac
              [ -f "$p" ] && LOGO="$p" && break
            done
          fi
          SPLASH=""
          for p in assets/splash.png splash.png assets/splash.jpg; do
            [ -f "$p" ] && SPLASH="$p" && break
          done
          echo "Logo ditemukan: ${LOGO:-TIDAK ADA} | Splash: ${SPLASH:-otomatis dari logo}"
          if [ -n "$LOGO" ]; then
            cp "$LOGO" assets/icon-only.png
            cp "$LOGO" assets/icon-foreground.png
            convert -size 1024x1024 xc:"#FFFFFF" assets/icon-background.png
            if [ -n "$SPLASH" ]; then
              cp "$SPLASH" assets/splash.png
            else
              convert -size 2732x2732 xc:"#FFFFFF" \( "$LOGO" -resize 1200x1200 \) -gravity center -composite assets/splash.png
            fi
            cp assets/splash.png assets/splash-dark.png
            npm install --save-dev @capacitor/assets --legacy-peer-deps
            npx capacitor-assets generate --android --iconBackgroundColor "#FFFFFF" --splashBackgroundColor "#FFFFFF"
          else
            echo "TIDAK ADA LOGO - pakai ikon bawaan Capacitor"
          fi

      - name: Arahkan APK langsung ke situs Vercel
        run: |
          node -e "
            const fs = require('fs');
            const p = 'android/app/src/main/assets/capacitor.config.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.server = Object.assign({}, c.server || {}, { url: '$VERCEL_URL' });
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log('server.url =', c.server.url);
          "

      - name: Izinkan kamera di AndroidManifest (registrasi wajah & liveness)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" $M || \
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' $M
          grep -q "android.permission.CAMERA" $M || \
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' $M

      - name: Build APK (debug)
        working-directory: android
        run: |
          bash gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo ""
            echo "==================== PENYEBAB GAGAL ===================="
            grep -B 2 -A 25 "What went wrong" build-log.txt || true
            echo "======================================================="
            exit 1
          fi
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Unggah log lengkap jika gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-build-gagal
          path: android/build-log.txt
          if-no-files-found: ignore

      - name: Unggah APK sebagai artefak
        uses: actions/upload-artifact@v4
        with:
          name: MyAbsen
          path: android/app/build/outputs/apk/debug/*.apk
