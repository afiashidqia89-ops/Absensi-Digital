name: Build APK Absensi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "mobile-www/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependensi
        run: npm install --no-audit --no-fund

      - name: Pastikan paket Capacitor terpasang
        run: npm install --no-audit --no-fund @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Buat project Android bila belum ada
        run: test -d android || npx cap add android

      - name: Pastikan izin kamera di AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" "$M" || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' "$M"
          grep -n "uses-permission" "$M"

      - name: Sinkronkan Capacitor
        run: npx cap sync android

      - name: Build APK (debug)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Unggah APK sebagai artefak
        uses: actions/upload-artifact@v4
        with:
          name: absensi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
