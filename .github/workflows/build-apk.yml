name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependensi
        run: npm install

      - name: Install Capacitor (CLI, core, android)
        run: npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Build web (opsional - tidak menghalangi build APK)
        run: npm run build
        continue-on-error: true

      - name: Siapkan project Android (buat otomatis jika belum ada, lalu sinkron)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Beri izin gradlew
        run: chmod +x android/gradlew

      - name: Build APK (debug)
        working-directory: android
        run: |
          bash gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo ""
            echo "==================== PENYEBAB GAGAL ===================="
            grep -B 2 -A 20 "What went wrong" build-log.txt || true
            echo "======================================================="
            exit 1
          fi
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Unggah APK sebagai artefak
        uses: actions/upload-artifact@v4
        with:
          name: absensi-apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
