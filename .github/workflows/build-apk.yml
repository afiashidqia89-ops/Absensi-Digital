name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependensi
        run: npm install

      - name: Build web
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sinkronkan Capacitor ke Android
        run: npx cap sync android

      - name: Beri izin gradlew
        run: chmod +x android/gradlew

      - name: Build APK (debug)
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Unggah APK sebagai artefak
        uses: actions/upload-artifact@v4
        with:
          name: absensi-apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
